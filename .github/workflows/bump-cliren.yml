name: Renomear cliente em cascata (v40)
on:
  push:
    paths:
      - '.github/workflows/bump-cliren.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=34', 'aparat-fix.js?v=35')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v39', 'aparat-v40')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          print('index v35:', 'aparat-fix.js?v=35' in io.open('index.html', encoding='utf-8').read())
          print('cascata:', 'nomeAntigo' in io.open('aparat-fix.js', encoding='utf-8').read())
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "feat: renomear cliente propaga em todos os registros (v40)"
          git push
