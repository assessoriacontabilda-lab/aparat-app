name: Aviso de pagamento com PIX dia 1
on:
  schedule:
    - cron: '30 12 1 * *'
  workflow_dispatch:
    inputs:
      simulacao:
        description: '1 = apenas simular (nao grava nada)'
        required: false
        default: '1'
      forcar:
        description: '1 = rodar mesmo fora do dia 1 ao 3'
        required: false
        default: '0'
jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        working-directory: notificador
        run: npm install --omit=dev --no-audit --no-fund
      - name: Enviar aviso de pagamento do mes
        working-directory: notificador
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          SIMULACAO: ${{ github.event.inputs.simulacao || '0' }}
          FORCAR: ${{ github.event.inputs.forcar || '0' }}
        run: node aviso-pix-mensal.js
