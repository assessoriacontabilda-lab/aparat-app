name: Tema claro do app do cliente (v44)
on:
  push:
    paths:
      - '.github/workflows/bump-tema.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=43', 'aparat-fix.js?v=44')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v41', 'aparat-v42')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          idx = io.open('index.html', encoding='utf-8').read()
          fix = io.open('aparat-fix.js', encoding='utf-8').read()
          print('index v44:', 'aparat-fix.js?v=44' in idx)
          print('sw v42:', 'aparat-v42' in io.open('sw.js', encoding='utf-8').read())
          print('modulo tema presente:', '__APARAT_TEMA__' in fix)
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "feat: tema claro do app do cliente com chave claro/escuro no menu (v44)"
          git push
