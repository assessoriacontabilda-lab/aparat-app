name: Tema claro do painel do escritorio (v47)
on:
  push:
    paths:
      - '.github/workflows/bump-tema4.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=46', 'aparat-fix.js?v=47')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v44', 'aparat-v45')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          fix = io.open('aparat-fix.js', encoding='utf-8').read()
          print('index v47:', 'aparat-fix.js?v=47' in io.open('index.html', encoding='utf-8').read())
          print('sw v45:', 'aparat-v45' in io.open('sw.js', encoding='utf-8').read())
          print('tema cliente:', '__APARAT_TEMA__=46' in fix)
          print('tema escritorio:', '__APARAT_TEMA_ESC__=47' in fix)
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "feat: tema claro do painel do escritorio com chave no menu (v47)"
          git push
