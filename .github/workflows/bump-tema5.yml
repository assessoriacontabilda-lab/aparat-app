name: Ajuste dos cartoes de acesso rapido (v48)
on:
  push:
    paths:
      - '.github/workflows/bump-tema5.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=47', 'aparat-fix.js?v=48')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v45', 'aparat-v46')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          print('index v48:', 'aparat-fix.js?v=48' in io.open('index.html', encoding='utf-8').read())
          print('tema escritorio v48:', '__APARAT_TEMA_ESC__=48' in io.open('aparat-fix.js', encoding='utf-8').read())
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "fix: cartoes de acesso rapido do painel no tema claro (v48)"
          git push
