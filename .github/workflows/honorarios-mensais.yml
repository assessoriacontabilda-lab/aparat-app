name: Honorarios automaticos dia 1
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      simulacao:
        description: '1 = apenas simular (nao grava nada)'
        required: false
        default: '1'
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        working-directory: notificador
        run: npm install --omit=dev --no-audit --no-fund
      - name: Gerar honorarios do mes
        working-directory: notificador
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          SIMULACAO: ${{ github.event.inputs.simulacao || '0' }}
        run: node gerar-honorarios.js
