name: Lembretes de agendamentos do dia
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      simulacao:
        description: '1 = apenas simular'
        required: false
        default: '1'
jobs:
  lembrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        working-directory: notificador
        run: npm install --omit=dev --no-audit --no-fund
      - name: Enviar lembretes de hoje
        working-directory: notificador
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          SIMULACAO: ${{ github.event.inputs.simulacao || '0' }}
        run: node lembretes-agenda.js
