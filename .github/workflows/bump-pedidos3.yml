name: Documentos Solicitados - notificacao push (v51)
on:
  push:
    paths:
      - '.github/workflows/bump-pedidos3.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=50', 'aparat-fix.js?v=51')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v48', 'aparat-v49')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          print('index v51:', 'aparat-fix.js?v=51' in io.open('index.html', encoding='utf-8').read())
          print('push pedidos:', '"pedidos"' in io.open('notificador/enviar.js', encoding='utf-8').read())
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "feat: notificacao no celular quando o escritorio envia documento solicitado (v51)"
          git push
