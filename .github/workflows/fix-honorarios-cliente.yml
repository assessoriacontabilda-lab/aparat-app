name: Corrigir lista de honorarios do cliente
on:
  push:
    paths:
      - ".github/workflows/fix-honorarios-cliente.yml"
  workflow_dispatch:
jobs:
  corrigir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Renomear div da lista de honorarios
        run: |
          python3 - <<'PY'
          s = open('index.html', encoding='utf-8').read()
          a = '<div class="asec" style="margin-top:12px">\U0001F4B3 Honorários</div><div id="cli-hon"></div>'
          b = '<div class="asec" style="margin-top:12px">\U0001F4B3 Honorários</div><div id="cli-hon-lista"></div>'
          assert a in s, 'trecho 1 nao encontrado'
          s = s.replace(a, b)
          c = "const ch=document.getElementById('cli-hon');"
          d = "const ch=document.getElementById('cli-hon-lista');"
          assert c in s, 'trecho 2 nao encontrado'
          s = s.replace(c, d)
          open('index.html', 'w', encoding='utf-8').write(s)
          PY
      - name: Commit
        run: |
          git config user.name "aparat-bot"
          git config user.email "bot@aparat.com"
          git add index.html
          git commit -m "Corrigir lista de honorarios do cliente (id duplicado)" || echo "nada a mudar"
          git push
