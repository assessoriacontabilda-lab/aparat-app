name: Alerta diario de inadimplencia
on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      simulacao:
        description: '1 = apenas simular (nao envia nada)'
        required: false
        default: '1'
jobs:
  alertar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        working-directory: notificador
        run: npm install --omit=dev --no-audit --no-fund
      - name: Verificar inadimplencia
        working-directory: notificador
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          SIMULACAO: ${{ github.event.inputs.simulacao || '0' }}
        run: node alerta-inadimplencia.js
