name: Agenda com Google e tipos manuais (v41)
on:
  push:
    paths:
      - '.github/workflows/bump-agtipos.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=35', 'aparat-fix.js?v=36')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v40', 'aparat-v41')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          print('index v36:', 'aparat-fix.js?v=36' in io.open('index.html', encoding='utf-8').read())
          print('tipos:', 'agendaTipos' in io.open('aparat-fix.js', encoding='utf-8').read())
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "feat: agenda com Google Agenda, novos tipos e tipos manuais (v41)"
          git push
