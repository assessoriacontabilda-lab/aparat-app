name: Calendario inteligente (v35)
on:
  push:
    paths:
      - '.github/workflows/bump-cal.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=30', 'aparat-fix.js?v=31')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v34', 'aparat-v35')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          print('index v31:', 'aparat-fix.js?v=31' in io.open('index.html', encoding='utf-8').read())
          print('calendario no aparat-fix:', '__APARAT_CAL__' in io.open('aparat-fix.js', encoding='utf-8').read())
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "feat: calendario inteligente de vencimentos e agendamentos (sw v35)"
          git push
