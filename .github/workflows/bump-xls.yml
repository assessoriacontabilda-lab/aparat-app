name: Relatorio Excel + limpeza de exemplos (v33)
on:
  push:
    paths:
      - '.github/workflows/bump-xls.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes e limpar exemplos
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=28', 'aparat-fix.js?v=29')
          for demo in ['<option>Mercearia Silva ME</option>', '<option>Tech Soluções LTDA</option>', '<option>Clínica Bem Estar</option>', '<option>Padaria Gostosa ME</option>']:
              c = c.replace(demo, '')
          c = c.replace('\U0001F3E2 Mercearia Silva ME', '\U0001F3E2 Cliente')
          c = c.replace('<div class="pnome">Mercearia Silva ME</div>', '<div class="pnome">Cliente</div>')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v32', 'aparat-v33')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          n = io.open('index.html', encoding='utf-8').read()
          print('index v29:', 'aparat-fix.js?v=29' in n, '| demos removidos:', 'Mercearia Silva ME</option>' not in n)
          print('excel no aparat-fix:', '__APARAT_XLS__' in io.open('aparat-fix.js', encoding='utf-8').read())
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "feat: relatorio excel + limpeza de clientes de exemplo (sw v33)"
          git push
