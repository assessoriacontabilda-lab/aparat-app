name: Icone da logo A no iPhone
on:
  push:
    paths:
      - ".github/workflows/bump-appleicon.yml"
  workflow_dispatch:
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Trocar apple-touch-icon
        run: |
          python3 - <<'PY'
          s = open('index.html', encoding='utf-8').read()
          s = s.replace('<link rel="apple-touch-icon" href="icone-aparat.png"/>', '<link rel="apple-touch-icon" href="icon-192.png"/>')
          open('index.html', 'w', encoding='utf-8').write(s)
          PY
      - name: Commit
        run: |
          git config user.name "aparat-bot"
          git config user.email "bot@aparat.com"
          git add index.html
          git commit -m "Icone da logo A no iPhone (apple-touch-icon)" || echo "nada a mudar"
          git push
