name: Correcao da leitura de pagamentos pelo cliente (v71)
on:
  push:
    paths:
      - '.github/workflows/bump-cobra2.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Subir a versao do script e do cache
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=70', 'aparat-fix.js?v=71')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v70', 'aparat-v71')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          f = io.open('aparat-fix.js', encoding='utf-8').read()
          print('index v71:', 'aparat-fix.js?v=71' in io.open('index.html', encoding='utf-8').read())
          print('sw v71:', 'aparat-v71' in io.open('sw.js', encoding='utf-8').read())
          print('leitura filtrada:', 'v71: pela regra do Firestore' in f)
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "v71: cliente le apenas os proprios pagamentos (regra do Firestore publicada)"
          git push
