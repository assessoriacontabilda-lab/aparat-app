name: Botao instalar aplicativo (v34)
on:
  push:
    paths:
      - '.github/workflows/bump-install.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=29', 'aparat-fix.js?v=30')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v33', 'aparat-v34')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          print('index v30:', 'aparat-fix.js?v=30' in io.open('index.html', encoding='utf-8').read())
          print('install no aparat-fix:', '__APARAT_INSTALL__' in io.open('aparat-fix.js', encoding='utf-8').read())
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "feat: botao instalar aplicativo PWA com instrucoes (sw v34)"
          git push
