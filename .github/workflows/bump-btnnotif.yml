name: Botao ativar notificacoes no painel (v28)
on:
  push:
    paths:
      - '.github/workflows/bump-btnnotif.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=23', 'aparat-fix.js?v=24')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v27', 'aparat-v28')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          ok1 = 'aparat-fix.js?v=24' in io.open('index.html', encoding='utf-8').read()
          ok2 = '__APARAT_BTN_NOTIF_ADM__' in io.open('aparat-fix.js', encoding='utf-8').read()
          print('index v24:', ok1, '| botao notif admin:', ok2)
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "feat: botao ativar notificacoes no painel do escritorio (sw v28)"
          git push
