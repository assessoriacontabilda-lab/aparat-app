name: Planilha automatica de honorarios
on:
  schedule:
    - cron: '15 11-23 * * *'
  workflow_dispatch:
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        working-directory: notificador
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm install --no-save --no-audit --no-fund google-spreadsheet@4 google-auth-library
      - name: Atualizar planilha
        working-directory: notificador
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: node planilha-honorarios.js
