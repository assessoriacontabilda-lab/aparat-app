name: Ajustes do tema claro (v45)
on:
  push:
    paths:
      - '.github/workflows/bump-tema2.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=44', 'aparat-fix.js?v=45')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v42', 'aparat-v43')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          print('index v45:', 'aparat-fix.js?v=45' in io.open('index.html', encoding='utf-8').read())
          print('sw v43:', 'aparat-v43' in io.open('sw.js', encoding='utf-8').read())
          print('tema v45:', 'window.__APARAT_TEMA__=45' in io.open('aparat-fix.js', encoding='utf-8').read())
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "fix: barra superior, cartao de vencimento e barra de instalacao no tema claro (v45)"
          git push
