name: Aba Documentos Solicitados - link e arquivo pequeno (v50)
on:
  push:
    paths:
      - '.github/workflows/bump-pedidos2.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=49', 'aparat-fix.js?v=50')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v47', 'aparat-v48')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          print('index v50:', 'aparat-fix.js?v=50' in io.open('index.html', encoding='utf-8').read())
          print('link e storage:', 'checarStorage' in io.open('aparat-fix.js', encoding='utf-8').read())
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "feat: aba Documentos Solicitados aceita link do Drive e arquivo ate 700 KB sem Storage (v50)"
          git push
