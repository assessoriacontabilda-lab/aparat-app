name: Motor unico instalacao e push (v36)
on:
  push:
    paths:
      - '.github/workflows/bump-swunico.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unificar service worker no index
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          antigo = "var reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');"
          novo = "var reg=await navigator.serviceWorker.ready;"
          assert antigo in c, 'trecho de registro nao encontrado'
          c = c.replace(antigo, novo)
          io.open('index.html', 'w', encoding='utf-8').write(c)
          ok = novo in io.open('index.html', encoding='utf-8').read()
          ok2 = 'onBackgroundMessage' in io.open('sw.js', encoding='utf-8').read()
          print('index usa sw unico:', ok, '| sw.js tem push:', ok2)
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "fix: motor unico - instalacao PWA + push no mesmo service worker (v36)"
          git push
