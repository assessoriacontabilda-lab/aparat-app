name: PIX no app do cliente (v32)
on:
  push:
    paths:
      - '.github/workflows/bump-pix.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=27', 'aparat-fix.js?v=28')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v31', 'aparat-v32')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          ok1 = 'aparat-fix.js?v=28' in io.open('index.html', encoding='utf-8').read()
          ok2 = '__APARAT_PIX__' in io.open('aparat-fix.js', encoding='utf-8').read()
          print('index v28:', ok1, '| pix no aparat-fix:', ok2)
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "feat: chave PIX com botao copiar na tela de honorarios do cliente (sw v32)"
          git push
