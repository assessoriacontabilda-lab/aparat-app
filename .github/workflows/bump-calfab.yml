name: Calendario bolinha flutuante no painel (v37)
on:
  push:
    paths:
      - '.github/workflows/bump-calfab.yml'
  workflow_dispatch:
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar versoes
        run: |
          python3 - << 'PYEOF'
          import io
          c = io.open('index.html', encoding='utf-8').read()
          c = c.replace('aparat-fix.js?v=31', 'aparat-fix.js?v=32')
          io.open('index.html', 'w', encoding='utf-8').write(c)
          s = io.open('sw.js', encoding='utf-8').read().replace('aparat-v36', 'aparat-v37')
          io.open('sw.js', 'w', encoding='utf-8').write(s)
          print('index v32:', 'aparat-fix.js?v=32' in io.open('index.html', encoding='utf-8').read())
          PYEOF
      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --staged --quiet || git commit -m "feat: calendario como bolinha flutuante tambem no painel + lista com mes seguinte (v37)"
          git push
