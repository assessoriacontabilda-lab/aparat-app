name: Seta voltar neon (nav v6)
on:
  push:
    paths:
      - ".github/workflows/bump-neon.yml"
  workflow_dispatch:
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Trocar versao do nav-snippet
        run: |
          python3 - <<'PY'
          s = open('index.html', encoding='utf-8').read()
          s = s.replace('nav-snippet.js?v=5', 'nav-snippet.js?v=6')
          open('index.html', 'w', encoding='utf-8').write(s)
          PY
      - name: Commit
        run: |
          git config user.name "aparat-bot"
          git config user.email "bot@aparat.com"
          git add index.html
          git commit -m "Seta voltar com neon (nav-snippet v6)" || echo "nada a mudar"
          git push
